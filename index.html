<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Log meals by photo or text and track calories, protein, carbs, fats and sugar." />
    <meta name="theme-color" content="#FAF6EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MealGlimpse</title>
    <script>
      // The app moved from its earlier address. Add ?stay to open the old address once more, e.g. to save a backup.
      if (location.hostname === 'trackmacros.theabhayperspective.com' && !/[?&]stay\b/.test(location.search)) {
        location.replace('https://www.mealglimpse.com/');
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('tm_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
